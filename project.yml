name: TimeMirror
options:
  bundleIdPrefix: com.timemirror
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  TimeMirror:
    type: application
    platform: iOS
    sources:
      - path: TimeMirror
      - path: Sources/TimeMirrorCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.timemirror.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
    scheme:
      testTargets:
        - TimeMirrorCoreTests
  TimeMirrorCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/TimeMirrorCoreTests
    dependencies:
      - target: TimeMirror
