name: TimeMirror iOS CI

on:
  push:
    paths:
      - "TimeMirror/**"
      - "Sources/**"
      - "Tests/**"
      - "TimeMirror.xcodeproj/**"
      - "Package.swift"
      - ".github/workflows/ios-ci.yml"
  pull_request:
    paths:
      - "TimeMirror/**"
      - "Sources/**"
      - "Tests/**"
      - "TimeMirror.xcodeproj/**"
      - "Package.swift"
      - ".github/workflows/ios-ci.yml"
  workflow_dispatch:

concurrency:
  group: time-mirror-ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test on iOS Simulator
    runs-on: macos-15
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Show Apple toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Test platform-independent core
        run: swift test

      - name: Select an available iPhone simulator
        shell: bash
        run: |
          simulator_udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          for runtime, devices in data["devices"].items():
              if "iOS" not in runtime:
                  continue
              for device in devices:
                  if device.get("isAvailable") and device.get("name", "").startswith("iPhone"):
                      print(device["udid"])
                      raise SystemExit(0)
          raise SystemExit("No available iPhone simulator found")
          ')
          echo "SIMULATOR_UDID=$simulator_udid" >> "$GITHUB_ENV"
          echo "Using simulator $simulator_udid"

      - name: Compile for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project TimeMirror.xcodeproj \
            -scheme TimeMirror \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath "$RUNNER_TEMP/TimeMirrorDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            | tee "$RUNNER_TEMP/time-mirror-build.log"

      - name: Run iOS Simulator tests
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project TimeMirror.xcodeproj \
            -scheme TimeMirror \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath "$RUNNER_TEMP/TimeMirrorDerivedData" \
            -resultBundlePath "$RUNNER_TEMP/TimeMirrorTests.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            | tee "$RUNNER_TEMP/time-mirror-tests.log"

      - name: Package Appetize browser preview
        shell: bash
        run: |
          app_path="$RUNNER_TEMP/TimeMirrorDerivedData/Build/Products/Debug-iphonesimulator/TimeMirror.app"
          preview_path="$RUNNER_TEMP/TimeMirror.app.zip"

          test -d "$app_path"
          ditto -c -k --sequesterRsrc --keepParent "$app_path" "$preview_path"
          ls -lh "$preview_path"

      - name: Upload Appetize preview artifact
        uses: actions/upload-artifact@v7
        with:
          name: time-mirror-appetize-preview-${{ github.run_number }}
          path: ${{ runner.temp }}/TimeMirror.app.zip
          if-no-files-found: error
          retention-days: 14

      - name: Publish preview to Appetize
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          APPETIZE_API_TOKEN: ${{ secrets.APPETIZE_API_TOKEN }}
        run: |
          if [[ -z "${APPETIZE_API_TOKEN:-}" ]]; then
            echo "APPETIZE_API_TOKEN is not configured; the preview artifact can still be uploaded manually."
            exit 0
          fi

          response_path="$RUNNER_TEMP/appetize-response.json"
          curl --fail-with-body --silent --show-error \
            --request POST "https://api.appetize.io/v1/apps" \
            --header "X-API-KEY: $APPETIZE_API_TOKEN" \
            --form "file=@$RUNNER_TEMP/TimeMirror.app.zip" \
            --form "platform=ios" \
            --form "note=TimeMirror ${GITHUB_SHA}" \
            --form "appPermissions.run=authenticated" \
            > "$response_path"

          public_key=$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1])).get("publicKey", ""))' "$response_path")
          if [[ -z "$public_key" ]]; then
            echo "Appetize did not return a preview identifier."
            cat "$response_path"
            exit 1
          fi

          preview_url="https://appetize.io/app/$public_key"
          echo "### Appetize browser preview" >> "$GITHUB_STEP_SUMMARY"
          echo "[Open TimeMirror in the browser simulator]($preview_url)" >> "$GITHUB_STEP_SUMMARY"
          echo "Preview access requires signing in to the Appetize organization that owns the API token." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build and test diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: time-mirror-ios-diagnostics-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/time-mirror-build.log
            ${{ runner.temp }}/time-mirror-tests.log
            ${{ runner.temp }}/TimeMirrorTests.xcresult
          if-no-files-found: warn
          retention-days: 14
